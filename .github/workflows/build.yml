name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK components
      run: |
        sdkmanager "platforms;android-35" "build-tools;35.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7 --distribution-type bin

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        set +e
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        BUILD_EXIT=${PIPESTATUS[0]}
        echo "BUILD_EXIT=$BUILD_EXIT" >> "$GITHUB_ENV"

    - name: Report build result
      if: always()
      run: |
        echo "## Build Result" >> "$GITHUB_STEP_SUMMARY"
        echo "Exit code: $BUILD_EXIT" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        if [ -f build.log ]; then
          # Extract error lines and last 200 lines
          grep -i 'error\|FAILURE\|Exception\|unresolved\|not found\|cannot find' build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '--- Last 200 lines ---' >> "$GITHUB_STEP_SUMMARY"
          tail -200 build.log >> "$GITHUB_STEP_SUMMARY"
        fi
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if build failed
      if: env.BUILD_EXIT != '0'
      run: exit 1

    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: materialyou-prefs-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: ignore
