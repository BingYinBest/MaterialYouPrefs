name: Build APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Run unit tests
        id: test
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      # --- Lint (M5) ---
      # Baseline was cleared to 0 errors / 0 warnings by:
      #   * suppressing 4 version-upgrade checkers (GradleDependency,
      #     AndroidGradlePluginVersion, OldTargetApi, ChromeOsAbiSupport)
      #   * deleting 3 unused resources (ic_launcher_background, app_name,
      #     Theme.MaterialYouPrefs)
      # `abortOnError = true` + `fatal = Error` in app/build.gradle.kts
      # makes any real lint error fail the gradle task itself.
      - name: Run lint (blocking, M5 baseline cleared)
        id: lint
        continue-on-error: true
        run: gradle lintDebug --no-daemon 2>&1 | tee lint.log

      # Summary: surface lint result in the PR check, so we can triage without
      # needing to dig through the whole log.
      #
      # PARSING CAUTION: `run: |` is a YAML literal block scalar. Every line
      # inside MUST be indented (>= 10 spaces here, matching the `- name:`
      # block above). If any line drops to column 0 (a common paste/
      # formatting bug), the whole workflow fails to parse and the run
      # terminates instantly with zero jobs / zero artifacts -- that's the
      # failure signature. Avoid multi-line $() command substitution inside
      # a block scalar; break long shell statements into separate lines.
      - name: Summarize lint results (M5)
        if: always()
        run: |
          echo "### Lint summary" >> "$GITHUB_STEP_SUMMARY"
          XML="app/build/reports/lint-results-debug.xml"
          HTML="app/build/reports/lint-results-debug.html"
          if [ ! -f "$XML" ]; then
            echo "lint XML not produced -- lint step probably failed early" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -20 lint.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no lint.log)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The XML uses one <issue> element per finding with a
          # 'severity' attribute (Fatal / Error / Warning).
          total=$(grep -oE '<issue[^>]*' "$XML" | wc -l)
          fatal=$(grep -oE '<issue[^>]*severity="Fatal"' "$XML" | wc -l)
          errors=$(grep -oE '<issue[^>]*severity="Error"' "$XML" | wc -l)
          warns=$(grep -oE '<issue[^>]*severity="Warning"' "$XML" | wc -l)
          {
            echo "| severity | count |"
            echo "|----------|-------|"
            echo "| Fatal    | $fatal |"
            echo "| Error    | $errors |"
            echo "| Warning  | $warns |"
            echo "| **Total**    | **$total** |"
            echo ""
            echo "Top 15 lint IDs (by frequency):"
            grep -oE 'id="[A-Z][A-Za-z]+"' "$XML" | sort | uniq -c | sort -rn | head -15
            echo ""
            echo "HTML report: $HTML"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure() || steps.build.outcome == 'failure' || steps.test.outcome == 'failure' || steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            build.log
            test.log
            lint.log
          retention-days: 7

      - name: Upload lint report (M5)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
            app/build/outputs/lint-results-debug/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail build if any blocking step failed
        # M5: lint is now blocking. Build + test + lint must all be clean.
        if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: |
          echo "Build outcome: ${steps.build.outcome}"
          echo "Test outcome:  ${steps.test.outcome}"
          echo "Lint outcome:  ${steps.lint.outcome}"
          exit 1

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: materialyou-prefs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
