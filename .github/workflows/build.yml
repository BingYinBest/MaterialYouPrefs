name: Build APK
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log
      - name: Run unit tests
        id: test
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log
      - name: Run lint (M5 baseline, non-blocking)
        id: lint
        continue-on-error: true
        run: gradle lintDebug --no-daemon 2>&1 | tee lint.log
      - name: Summarize lint results (M5)
        # Parse the XML lint report (produced by lintDebug) into a
        # severity-bucketed summary we can eyeball in the Actions UI
        # and also commit to dev-log/lint-baseline.md for tracking
        # issue counts across commits.
        if: always()
        run: |
          echo "### Lint summary" >> "$GITHUB_STEP_SUMMARY"
          XML="app/build/reports/lint-results-debug.xml"
          HTML="app/build/reports/lint-results-debug.html"
          if [ ! -f "$XML" ]; then
            echo "lint XML not produced — lint step probably failed early" >> "$GITHUB_STEP_SUMMARY"
            echo "```
$(tail -20 lint.log 2>/dev/null || echo '(no lint.log)')" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The XML uses one <issue> element per finding with a
          # 'severity' attribute (Error / Warning / Fatal).
          total=$(grep -oE '<issue[^>]*' "$XML" | wc -l)
          fatal=$(grep -oE '<issue[^>]*severity="Fatal"' "$XML" | wc -l)
          errors=$(grep -oE '<issue[^>]*severity="Error"' "$XML" | wc -l)
          warns=$(grep -oE '<issue[^>]*severity="Warning"' "$XML" | wc -l)
          echo "| severity | count |"
          echo "|----------|-------|"
          echo "| Fatal    | $fatal |"
          echo "| Error    | $errors |"
          echo "| Warning  | $warns |"
          echo "| **Total**    | **$total** |"
          echo ""
          echo "Top 15 lint IDs (by frequency):" >> "$GITHUB_STEP_SUMMARY"
          grep -oE 'id="[A-Z][A-Za-z]+"' "$XML" | sort | uniq -c | sort -rn | head -15 >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "HTML report: $HTML" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs on failure
        if: failure() || steps.build.outcome == 'failure' || steps.test.outcome == 'failure' || steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            build.log
            test.log
            lint.log
          retention-days: 7
      - name: Upload lint report (M5)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
            app/build/outputs/lint-results-debug/**
          retention-days: 14
          if-no-files-found: ignore
      - name: Fail build if any blocking step failed
        # Lint is currently non-blocking: we're still surveying the baseline
        # issue count and will flip this to include steps.lint.outcome once
        # the lint gate is green in the M5 polish pass.
        if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
        run: |
          echo "Build outcome: ${steps.build.outcome}"
          echo "Test outcome:  ${steps.test.outcome}"
          echo "Lint outcome:  ${steps.lint.outcome}  (informational only)"
          exit 1
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: materialyou-prefs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
